syntax = "proto3";
package wktdemo;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message All {
  google.protobuf.Timestamp at = 1;
  google.protobuf.Duration took = 2;
  google.protobuf.BoolValue flag = 3;
  google.protobuf.Int32Value count = 4;
  google.protobuf.StringValue label = 5;
  google.protobuf.FieldMask mask = 6;
  google.protobuf.Any blob = 7;
  google.protobuf.Empty nothing = 8;
}
