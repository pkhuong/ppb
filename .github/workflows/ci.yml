name:
on: [push, pull_request]
jobs:
  x86-64-bmi:
    runs-on: ubuntu-slim
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y gcovr clang xxd
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test
        run: make CC=gcc EXTRA_FLAGS=-mbmi2 test
      - name: build and test (sanitizers)
        run: make CC=clang EXTRA_FLAGS="-mbmi2 -fsanitize=address,undefined -fno-omit-frame-pointer" test
      - name: gather coverage
        run: export EXTRA_FLAGS=-mbmi2 ; ./coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "build/coverage/*.gc*"
          gcov_include: "src/*.[ch]"

  i686:
    runs-on: ubuntu-slim
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y clang gcc-multilib xxd
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test
        run: make CC=gcc EXTRA_FLAGS=-m32 test
      - name: build and test (sanitizers)
        run: make CC=clang EXTRA_FLAGS="-m32 -fsanitize=address,undefined -fno-omit-frame-pointer" test

  aarch64-vanilla:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y gcovr clang xxd
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test
        run: make CC=gcc test
      - name: build and test (sanitizers)
        run: make CC=clang EXTRA_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" test
      - name: gather coverage
        run: ./coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "build/coverage/*.gc*"
          gcov_include: "src/*.[ch]"

  s390x-be:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test (s390x, big-endian)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y make gcc clang xxd
          run: |
            make CC=gcc test
            # ASan reserves a huge virtual shadow region on startup, which
            # the s390x QEMU container can't satisfy without overcommit.
            # Run UBSan only here.
            make CC=clang EXTRA_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" test
