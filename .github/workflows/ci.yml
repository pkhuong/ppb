name:
on: [push, pull_request]
permissions:
  contents: read
jobs:
  x86-64-bmi:
    runs-on: ubuntu-slim
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y g++ clang xxd
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test
        run: make CC=gcc CXX=g++ EXTRA_FLAGS=-mbmi2 test unit_cpp
      - name: build and test (sanitizers)
        run: make CC=clang CXX=clang++ EXTRA_FLAGS="-mbmi2 -fsanitize=address,undefined -fno-omit-frame-pointer" test unit_cpp
      - name: build and test (msan)
        run: make CC=clang CXX=clang++ EXTRA_FLAGS="-mbmi2 -fsanitize=memory -fno-omit-frame-pointer" test unit_cpp
      # - name: type sanitizer (C++ wrapper)
      #   run: make CC=gcc CXX=g++ tysan
      - name: gather coverage
        run: export EXTRA_FLAGS=-mbmi2 ; GCDA_ONLY=1 ./coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "build/coverage/*.gc*"
          gcov_include: "src/*.[ch] include/ppb/*.hpp"

  i686:
    runs-on: ubuntu-slim
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y clang gcc-multilib g++-multilib xxd
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test
        run: make CC=gcc CXX=g++ EXTRA_FLAGS=-m32 test unit_cpp
      - name: build and test (sanitizers)
        run: make CC=clang CXX=clang++ EXTRA_FLAGS="-m32 -fsanitize=address,undefined -fno-omit-frame-pointer" test unit_cpp

  aarch64-vanilla:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y g++ clang xxd
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test
        run: make CC=gcc CXX=g++ test unit_cpp
      - name: build and test (sanitizers)
        run: make CC=clang CXX=clang++ EXTRA_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" test unit_cpp
      - name: build and test (msan)
        run: make CC=clang CXX=clang++ EXTRA_FLAGS="-fsanitize=memory -fno-omit-frame-pointer" test unit_cpp
      # - name: type sanitizer (C++ wrapper)
      #   run: make CC=gcc CXX=g++ tysan
      - name: gather coverage
        run: GCDA_ONLY=1 ./coverage.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "build/coverage/*.gc*"
          gcov_include: "src/*.[ch] include/ppb/*.hpp"

  generator-test:
    runs-on: ubuntu-latest
    steps:
      - name: install deps
        run: |
          sudo apt-get update && sudo apt-get install -y g++ protobuf-compiler
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: checkout
        uses: actions/checkout@v4
      - name: generator test
        run: make CC=gcc CXX=g++ generator_test

  differential:
    runs-on: ubuntu-slim
    steps:
      - name: install deps
        run: |
          sudo apt-get update && sudo apt-get install -y g++ clang libclang-rt-dev cmake git pkg-config protobuf-compiler libprotobuf-dev python3
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: checkout
        uses: actions/checkout@v4
      # libprotobuf-mutator is not apt-packaged; build it from the same tag
      # as differential/Makefile, against the apt libprotobuf.
      - name: build libprotobuf-mutator (pinned tag)
        run: |
          git clone --depth 1 --branch v1.5 https://github.com/google/libprotobuf-mutator /tmp/lpm
          cmake -S /tmp/lpm -B /tmp/lpm/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_STANDARD=17 \
            -DLIB_PROTO_MUTATOR_DOWNLOAD_PROTOBUF=OFF -DLIB_PROTO_MUTATOR_TESTING=OFF -DLIB_PROTO_MUTATOR_EXAMPLES=OFF
          cmake --build /tmp/lpm/build -j"$(nproc)"
          sudo cmake --install /tmp/lpm/build
      # Deterministic subset only, no conformance runner (don't try docker-in-docker).
      - name: run differential (no Docker, no runner, no time-bounded fuzzing)
        run: make CC=gcc CXX=g++ differential-ci

  s390x-be:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build and test (s390x, big-endian)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: s390x
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y make gcc g++ clang xxd python3
          run: |
            make CC=gcc CXX=g++ test unit_cpp
            # ASan reserves a huge virtual shadow region on startup, which
            # the s390x QEMU container can't satisfy without overcommit.
            # Run UBSan only here.
            make CC=clang CXX=clang++ EXTRA_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" test unit_cpp
